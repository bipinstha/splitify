name: Splitify CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy-backend-and-web:
    name: Deploy Backend & Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/mobile-web/package-lock.json

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Build & Deploy SAM Stack
        run: |
          cd services/api
          npm install
          sam build
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset --stack-name splitify-api --capabilities CAPABILITY_IAM

      - name: Install Web Dependencies
        run: |
          cd apps/mobile-web
          npm ci

      - name: Build & Deploy Web App to S3 + CloudFront
        run: |
          chmod +x scripts/deploy-web.sh
          ./scripts/deploy-web.sh splitify-api
