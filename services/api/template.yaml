AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Splitify API - Backend for Splitwise Clone

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Environment:
      Variables:
        DATA_BUCKET: !Ref DataBucket
        NOTIFICATION_TOPIC_ARN: !Ref NotificationTopic

Resources:
  # Cognito User Pool
  SplitifyUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: splitify-user-pool
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false

  # Google Identity Provider
  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref SplitifyUserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: "355873228126-45c939sdp3e24gc7giiamrm95608h9md.apps.googleusercontent.com"
        client_secret: "{{resolve:ssm:/splitify/google/client_secret}}"
        authorize_scopes: "email openid profile"
      AttributeMapping:
        email: email
        name: name

  # Facebook Identity Provider
  FacebookIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref SplitifyUserPool
      ProviderName: Facebook
      ProviderType: Facebook
      ProviderDetails:
        client_id: "2469978866775717"
        client_secret: "{{resolve:ssm:/splitify/facebook/client_secret}}"
        authorize_scopes: "email,public_profile"
      AttributeMapping:
        email: email
        name: name

  # Cognito User Pool Client
  SplitifyUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - GoogleIdentityProvider
      - FacebookIdentityProvider
    Properties:
      ClientName: splitify-app-client
      UserPoolId: !Ref SplitifyUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      SupportedIdentityProviders:
        - COGNITO
        - Google
        - Facebook
      AllowedOAuthFlows:
        - code
        - implicit
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs:
        - "exp://localhost:19000"
        - "http://localhost:8081"
        - "splitify://"
        - !Sub "https://${WebAppCloudFrontDistribution.DomainName}"
      LogoutURLs:
        - "exp://localhost:19000"
        - "http://localhost:8081"
        - "splitify://"
        - !Sub "https://${WebAppCloudFrontDistribution.DomainName}"

  # Cognito Domain
  SplitifyUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "splitify-auth-v2-${AWS::AccountId}"
      UserPoolId: !Ref SplitifyUserPool

  # S3 Bucket for Data Storage
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "splitify-data-v2-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: ['*'] # In production, restrict this to your domain
            MaxAge: 3000

  # S3 Bucket for Static Web App Hosting
  WebAppBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "splitify-web-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # CloudFront Origin Access Control (OAC)
  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "splitify-web-oac-${AWS::AccountId}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # CloudFront Distribution for Web App
  WebAppCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: S3WebOrigin
            DomainName: !GetAtt WebAppBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CloudFrontOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: S3WebOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  # S3 Bucket Policy for CloudFront Access
  WebAppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebAppBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebAppBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebAppCloudFrontDistribution}"

  # API Gateway
  SplitifyApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,authorization,x-amz-date,x-api-key,x-amz-security-token'"
        AllowOrigin: "'*'"
        MaxAge: "'600'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt SplitifyUserPool.Arn

  # SNS Topic for Notifications
  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: splitify-notifications

  # Single Monolith Router Lambda Function
  SplitifyApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handler.main
      Environment:
        Variables:
          USER_POOL_ID: !Ref SplitifyUserPool
      Events:
        ProxyApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY
            RestApiId: !Ref SplitifyApi
        ProxyApiGreedy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref SplitifyApi
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotificationTopic.TopicName
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
              Resource: !GetAtt SplitifyUserPool.Arn
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - src/handler.ts

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${SplitifyApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  UserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref SplitifyUserPool
  UserPoolClientId:
    Description: "Cognito App Client ID"
    Value: !Ref SplitifyUserPoolClient
  WebAppUrl:
    Description: "Web Application CloudFront URL"
    Value: !Sub "https://${WebAppCloudFrontDistribution.DomainName}"
  WebAppBucketName:
    Description: "Web Application S3 Bucket Name"
    Value: !Ref WebAppBucket
  CloudFrontDistributionId:
    Description: "CloudFront Distribution ID"
    Value: !Ref WebAppCloudFrontDistribution
