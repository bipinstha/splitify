            Method: post
            RestApiId: !Ref SplitifyApi
      Policies:
        - S3WritePolicy:
            BucketName: !Ref DataBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints:
          - src/handlers/comments.ts

  ListCommentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/comments.list
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /comments
            Method: get
            RestApiId: !Ref SplitifyApi
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints:
          - src/handlers/comments.ts

  CreateSettlementFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/settlements.create
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /settlements
            Method: post
            RestApiId: !Ref SplitifyApi
      Policies:
        - S3WritePolicy:
            BucketName: !Ref DataBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints:
          - src/handlers/settlements.ts

  GetGroupAnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/analytics.getGroupAnalytics
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /groups/analytics
            Method: get
            RestApiId: !Ref SplitifyApi
      Policies:
