            BucketName: !Ref DataBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - src/handlers/analytics.ts

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${SplitifyApi}.execute-api.${AWS::Region}.amazonaws.com/prod/"
  UserPoolId:
    Description: "Cognito User Pool ID"
    Value: !Ref SplitifyUserPool
  UserPoolClientId:
    Description: "Cognito App Client ID"
    Value: !Ref SplitifyUserPoolClient
