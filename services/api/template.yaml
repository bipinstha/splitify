    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - src/handlers/balances.ts

  AddCommentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/comments.add
      Events:
        ApiEvent:
          Type: Api
          Properties:
