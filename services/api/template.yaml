AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Splitify API - Backend for Splitwise Clone

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs20.x
    Environment:
      Variables:
        DATA_BUCKET: !Ref DataBucket
        NOTIFICATION_TOPIC_ARN: !Ref NotificationTopic

Resources:
  # Cognito User Pool
  SplitifyUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: splitify-user-pool
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false

  # Google Identity Provider
  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref SplitifyUserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: "355873228126-45c939sdp3e24gc7giiamrm95608h9md.apps.googleusercontent.com"
        client_secret: "{{resolve:ssm:/splitify/google/client_secret}}"
        authorize_scopes: "email openid profile"
      AttributeMapping:
        email: email
        name: name

  # Facebook Identity Provider
  FacebookIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      UserPoolId: !Ref SplitifyUserPool
      ProviderName: Facebook
      ProviderType: Facebook
      ProviderDetails:
        client_id: "2469978866775717"
        client_secret: "{{resolve:ssm:/splitify/facebook/client_secret}}"
        authorize_scopes: "email,public_profile"
      AttributeMapping:
        email: email
        name: name

  # Cognito User Pool Client
  SplitifyUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - GoogleIdentityProvider
      - FacebookIdentityProvider
    Properties:
      ClientName: splitify-app-client
      UserPoolId: !Ref SplitifyUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      SupportedIdentityProviders:
        - COGNITO
        - Google
        - Facebook
      AllowedOAuthFlows:
        - code
        - implicit
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs:
        - "exp://localhost:19000"
        - "http://localhost:8081"
        - "splitify://"
      LogoutURLs:
        - "exp://localhost:19000"
        - "http://localhost:8081"
        - "splitify://"

  # Cognito Domain
  SplitifyUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "splitify-auth-v2-${AWS::AccountId}"
      UserPoolId: !Ref SplitifyUserPool

  # S3 Bucket for Data Storage
  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "splitify-data-v2-${AWS::AccountId}"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
            AllowedOrigins: ['*'] # In production, restrict this to your domain
            MaxAge: 3000

  # API Gateway
  SplitifyApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token,authorization,x-amz-date,x-api-key,x-amz-security-token'"
        AllowOrigin: "'*'"
        MaxAge: "'600'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt SplitifyUserPool.Arn

  # SNS Topic for Notifications
  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: splitify-notifications

  # Lambda Functions
  CreateExpenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/expenses.create
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /expenses
            Method: post
            RestApiId: !Ref SplitifyApi
      Policies:
        - S3WritePolicy:
            BucketName: !Ref DataBucket
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotificationTopic.TopicName
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - src/handlers/expenses.ts

  DeleteExpenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/expenses.remove
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /expenses
            Method: delete
            RestApiId: !Ref SplitifyApi
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - src/handlers/expenses.ts

  UpdateExpenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/expenses.update
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /expenses
            Method: put
            RestApiId: !Ref SplitifyApi
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - src/handlers/expenses.ts

  GetUploadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/attachments.getUploadUrl
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /attachments/upload-url
            Method: post
            RestApiId: !Ref SplitifyApi
      Policies:
        - S3WritePolicy:
            BucketName: !Ref DataBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - src/handlers/attachments.ts

  ListExpensesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/listExpenses.list
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /expenses
            Method: get
            RestApiId: !Ref SplitifyApi
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - src/handlers/listExpenses.ts

  CreateGroupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/groups.create
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /groups
            Method: post
            RestApiId: !Ref SplitifyApi
      Policies:
        - S3WritePolicy:
            BucketName: !Ref DataBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - src/handlers/groups.ts

  ListGroupsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/groups.list
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /groups
            Method: get
            RestApiId: !Ref SplitifyApi
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - src/handlers/groups.ts

  UpdateGroupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/groups.update
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /groups
            Method: put
            RestApiId: !Ref SplitifyApi
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
        - S3WritePolicy:
            BucketName: !Ref DataBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - src/handlers/groups.ts

  DeleteGroupFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/groups.remove
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /groups
            Method: delete
            RestApiId: !Ref SplitifyApi
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref DataBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - src/handlers/groups.ts

  GetUserProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/groups.profile
      Environment:
        Variables:
          USER_POOL_ID: !Ref SplitifyUserPool
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /users/profile
            Method: get
            RestApiId: !Ref SplitifyApi
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ListUsers
              Resource: !GetAtt SplitifyUserPool.Arn
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - src/handlers/groups.ts

  ListActivitiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/activities.list
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /activities
            Method: get
            RestApiId: !Ref SplitifyApi
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - src/handlers/activities.ts

  InviteMemberFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/groups.invite
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /groups/invite
            Method: post
            RestApiId: !Ref SplitifyApi
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
        - S3WritePolicy:
            BucketName: !Ref DataBucket
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotificationTopic.TopicName
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - src/handlers/groups.ts

  SavePushTokenFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/users.saveToken
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /users/push-token
            Method: post
            RestApiId: !Ref SplitifyApi
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
        - S3WritePolicy:
            BucketName: !Ref DataBucket
        - SNSCrudPolicy:
            TopicName: !GetAtt NotificationTopic.TopicName
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        EntryPoints: 
          - src/handlers/users.ts

  GetBalancesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/handlers/balances.get
      Events:
        ApiEvent:
          Type: Api
          Properties:
